<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anotações de Python — Gabriel Borges</title>
<style>
  :root{
    --bg: #1b1b1b;
    --bg-soft: #222222;
    --card: #242424;
    --card-border: #3a3a3a;
    --card-border-hover: #d99a3d;
    --text: #e7e3da;
    --text-dim: #9a958a;
    --text-faint: #6f6a60;
    --accent: #e0a458;
    --accent-dim: #b98644;
    --mono: #7fb59e;
    --divider: #333333;
    --focus: #e0a458;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
    line-height: 1.5;
    padding: 48px 24px 96px;
  }
  .wrap{ max-width: 1120px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 48px; }
  header h1{
    color: var(--accent);
    font-size: 1.9rem;
    letter-spacing: 1px;
    margin: 0 0 10px;
    font-weight: 700;
  }
  header p{
    color: var(--text-dim);
    letter-spacing: 3px;
    font-size: 0.78rem;
    text-transform: uppercase;
    margin: 0;
  }

  .section-label{
    display:flex; align-items:center; gap:10px;
    color: var(--text-dim);
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 40px 0 14px;
  }
  .section-label .n{ color: var(--accent-dim); }
  .section-label::after{
    content:""; flex:1; height:1px; background: var(--divider);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    color: inherit;
    font-family: inherit;
    display:flex;
    flex-direction:column;
    gap: 10px;
    position: relative;
  }
  .card:hover, .card:focus-visible{
    border-color: var(--card-border-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .card:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .card .icon{
    font-size: 1.3rem;
    color: var(--accent);
    line-height:1;
  }
  .card h3{
    margin: 0;
    font-size: 0.96rem;
    color: var(--accent);
    font-weight: 700;
  }
  .card .tags{
    color: var(--text-faint);
    font-size: 0.74rem;
    letter-spacing: .3px;
    margin-top: auto;
  }
  .card .hint{
    position:absolute; top:14px; right:16px;
    font-size: .68rem; color: var(--text-faint);
    opacity:0; transition: opacity .15s ease;
  }
  .card:hover .hint, .card:focus-visible .hint{ opacity:1; }

  /* Modal */
  .overlay{
    position: fixed; inset:0;
    background: var(--bg-soft);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding: 0;
    z-index: 50;
    overflow-y: auto;
  }
  .overlay.open{ display:flex; }

  .modal{
    background: var(--bg-soft);
    border: none;
    border-radius: 0;
    max-width: 860px;
    width: 100%;
    min-height: 100vh;
    padding: 32px 32px 60px;
    animation: rise .18s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .modal-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap: 16px;
    border-bottom: 1px solid var(--divider);
    padding-bottom: 16px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    background: var(--bg-soft);
    padding-top: 8px;
    margin-top: -8px;
    z-index: 1;
  }
  .modal-head .icon{ font-size: 1.5rem; color: var(--accent); }
  .modal-title{ display:flex; gap: 14px; align-items:flex-start; }
  .modal-title h2{
    margin: 0 0 4px; color: var(--accent); font-size: 1.25rem;
  }
  .modal-title .sub{ color: var(--text-dim); font-size: .78rem; letter-spacing: .5px; }

  .close-btn{
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    border-radius: 6px;
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    flex-shrink: 0;
  }
  .close-btn:hover, .close-btn:focus-visible{
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
  }

  .modal-body h4{
    color: var(--mono);
    font-size: .8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 22px 0 8px;
  }
  .modal-body h4:first-child{ margin-top: 0; }
  .modal-body ul{
    margin: 0 0 4px; padding-left: 18px;
    color: var(--text);
    font-size: .88rem;
  }
  .modal-body li{ margin-bottom: 5px; }
  .modal-body li b{ color: var(--text); }
  .modal-body p{ font-size: .88rem; color: var(--text); margin: 0 0 8px; }

  pre{
    background: #1a1a1a;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: .82rem;
    color: var(--mono);
    margin: 6px 0 4px;
  }
  code{ color: var(--mono); }
  .modal-body p code, .modal-body li code{
    background: #1a1a1a;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: .84rem;
  }

  .pitfall{
    margin-top: 18px;
    border-left: 3px solid var(--accent-dim);
    background: rgba(224,164,88,0.06);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: .84rem;
  }
  .pitfall b{ color: var(--accent); }

  .exercicio{
    border: 1px solid var(--card-border);
    border-radius: 8px;
    margin-top: 10px;
    overflow: hidden;
  }
  .exercicio .enunciado{
    padding: 10px 14px;
    font-size: .85rem;
    color: var(--text);
    background: #1f1f1f;
  }
  .exercicio .enunciado b{ color: var(--mono); }
  .exercicio details{ border-top: 1px solid var(--card-border); }
  .exercicio summary{
    padding: 8px 14px;
    font-size: .74rem;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--accent-dim);
    cursor: pointer;
    user-select: none;
    list-style: none;
  }
  .exercicio summary::-webkit-details-marker{ display:none; }
  .exercicio summary::before{ content: "▸ "; }
  .exercicio details[open] summary::before{ content: "▾ "; }
  .exercicio summary:hover{ color: var(--accent); }
  .exercicio .solucao{ padding: 2px 14px 12px; }
  .exercicio .explicacao{
    font-size: .82rem;
    color: var(--text-dim);
    margin: 6px 0 0;
  }

  .search-bar{
    max-width: 420px;
    margin: 0 auto 40px;
    position: relative;
  }
  .search-bar input{
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    font-family: inherit;
    font-size: .85rem;
    padding: 10px 14px 10px 34px;
    border-radius: 8px;
    outline: none;
    transition: border-color .15s ease;
  }
  .search-bar input::placeholder{ color: var(--text-faint); }
  .search-bar input:focus{ border-color: var(--card-border-hover); }
  .search-bar .icon{
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: .85rem;
    pointer-events: none;
  }
  .search-bar .count{
    text-align: center;
    color: var(--text-faint);
    font-size: .7rem;
    margin-top: 8px;
    letter-spacing: .5px;
  }
  .card.hidden{ display:none; }
  .section-label.hidden{ display:none; }
  .grid.hidden{ display:none; }
  .no-results{
    display:none;
    text-align:center;
    color: var(--text-faint);
    font-size: .82rem;
    padding: 40px 0;
  }
  .no-results.show{ display:block; }

  footer{
    text-align:center;
    color: var(--text-faint);
    font-size: .72rem;
    margin-top: 56px;
    letter-spacing: .5px;
  }

  @media (max-width: 480px){
    body{ padding: 32px 14px 72px; }
    .modal{ padding: 20px 16px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Anotações de Python</h1>
    <p>Gabriel Borges</p>
  </header>

  <div class="search-bar">
    <span class="icon">⌕</span>
    <input type="text" id="search-input" placeholder="Buscar por tópico, tag ou palavra-chave..." aria-label="Buscar anotações">
    <div class="count" id="search-count"></div>
  </div>

  <div id="sections">
  <div class="section-label" data-section="fundamentos"><span class="n">§</span> Fundamentos</div>
  <div class="grid" id="grid-fundamentos" data-section="fundamentos"></div>

  <div class="section-label" data-section="estruturas"><span class="n">§</span> Estruturas de Dados</div>
  <div class="grid" id="grid-estruturas" data-section="estruturas"></div>

  <div class="section-label" data-section="poo"><span class="n">§</span> Orientação a Objetos &amp; Erros</div>
  <div class="grid" id="grid-poo" data-section="poo"></div>

  <div class="section-label" data-section="ecossistema"><span class="n">§</span> Ecossistema &amp; Backend</div>
  <div class="grid" id="grid-ecossistema" data-section="ecossistema"></div>

  <div class="section-label" data-section="avancado"><span class="n">§</span> Recursos Avançados</div>
  <div class="grid" id="grid-avancado" data-section="avancado"></div>
  </div>

  <div class="no-results" id="no-results">Nenhum tópico encontrado. Tente outra palavra-chave.</div>

  <footer>Clique em qualquer card para abrir as anotações · Enter / Espaço também funciona</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div class="modal-title">
        <span class="icon" id="modal-icon"></span>
        <div>
          <h2 id="modal-title"></h2>
          <div class="sub" id="modal-sub"></div>
        </div>
      </div>
      <button class="close-btn" id="close-btn" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const DATA = {
  fundamentos: [
    {
      icon:"⌗", title:"Sintaxe & Variáveis", tags:"tipos · indentação · f-strings",
      sub:"Fundamentos",
      sections:[
        {h:"Tipagem", items:[
          "Python é <b>dinamicamente tipado</b>: o tipo é da variável em tempo de execução, não declarado.",
          "Tipos nativos: <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>, <code>NoneType</code>.",
          "Use <code>type(x)</code> para inspecionar e <code>isinstance(x, int)</code> para checar."
        ]},
        {h:"Indentação", items:[
          "Blocos são definidos por indentação (4 espaços é a convenção PEP8), não por chaves.",
          "Misturar tabs e espaços quebra o parser — configure o editor para converter tab em espaços."
        ]},
        {code:"nome = \"Gabriel\"\nidade = 21\naltura = 1.78\n\nprint(f\"{nome} tem {idade} anos e {altura:.2f}m\")"},
        {h:"f-strings", items:[
          "Preferíveis a <code>%</code> ou <code>.format()</code>: mais legíveis e mais rápidas.",
          "Suportam expressões dentro das chaves: <code>f\"{a + b}\"</code>."
        ]}
      ],
      pitfall:"Cuidado: <code>0.1 + 0.2 != 0.3</code> por causa de ponto flutuante. Para comparar floats, use <code>math.isclose()</code>.",
      exercicios:[
        {
          enunciado:"Peça o nome e o ano de nascimento do usuário e imprima a idade aproximada dele em 2026, usando f-string.",
          solucao:"nome = input(\"Nome: \")\nano_nascimento = int(input(\"Ano de nascimento: \"))\n\nidade = 2026 - ano_nascimento\nprint(f\"{nome} tem aproximadamente {idade} anos.\")",
          explicacao:"input() sempre retorna string, por isso o ano precisa ser convertido com int() antes da subtração. A f-string insere a expressão idade diretamente no texto."
        },
        {
          enunciado:"Dado um preço em reais (float), imprima o valor formatado com 2 casas decimais e o símbolo R$.",
          solucao:"preco = 1234.5\nprint(f\"R$ {preco:.2f}\")",
          explicacao:"O especificador :.2f dentro da f-string arredonda e formata o float com exatamente duas casas decimais — não precisa de round() manual."
        }
      ]
    },
    {
      icon:"⌥", title:"Estruturas de Controle", tags:"if/elif/else · for · while",
      sub:"Fundamentos",
      sections:[
        {h:"Condicionais", items:[
          "Python não tem <code>switch</code> nativo (mas 3.10+ tem <code>match/case</code>).",
          "Operadores lógicos são palavras: <code>and</code>, <code>or</code>, <code>not</code> — não <code>&&</code>/<code>||</code>."
        ]},
        {code:"idade = 20\nif idade >= 18 and idade < 65:\n    categoria = \"adulto\"\nelif idade >= 65:\n    categoria = \"idoso\"\nelse:\n    categoria = \"menor\""},
        {h:"Laços", items:[
          "<code>for</code> itera sobre qualquer iterável (não é laço de contador clássico).",
          "<code>range(inicio, fim, passo)</code> gera sequência sem alocar lista inteira.",
          "<code>while</code> + <code>break</code>/<code>continue</code> para controle fino.",
          "Todo <code>for</code>/<code>while</code> aceita <code>else</code>: executa se não houve <code>break</code>."
        ]},
        {code:"for i in range(5):\n    if i == 3:\n        break\n    print(i)\nelse:\n    print(\"loop completo\")  # não roda, houve break"}
      ],
      pitfall:"Evite comparar booleanos com valores fixos tipo <code>if resultado == True</code>. A expressão lógica já <b>é</b> o valor — retorne/compare a condição diretamente em vez de codificar strings/valores prontos.",
      exercicios:[
        {
          enunciado:"Escreva uma função par_ou_impar(n) que retorne a string \"par\" ou \"ímpar\" — sem usar if/else, apenas uma expressão lógica.",
          solucao:"def par_ou_impar(n):\n    return \"par\" if n % 2 == 0 else \"ímpar\"\n\nprint(par_ou_impar(7))   # ímpar\nprint(par_ou_impar(10))  # par",
          explicacao:"O operador ternário (valor_se_verdadeiro if condição else valor_se_falso) substitui um if/else de uma linha. Evita o erro comum de 'hardcodar' o retorno em vez de calcular a condição."
        },
        {
          enunciado:"Some todos os números de 1 a 100 que sejam múltiplos de 3 ou 5, usando um único for.",
          solucao:"total = 0\nfor n in range(1, 101):\n    if n % 3 == 0 or n % 5 == 0:\n        total += n\n\nprint(total)  # 2418",
          explicacao:"O operador or garante que o número entre na soma se satisfizer qualquer uma das duas condições, sem precisar checar cada caso separadamente."
        }
      ]
    },
    {
      icon:"ƒ", title:"Funções", tags:"*args · **kwargs · lambda",
      sub:"Fundamentos",
      sections:[
        {h:"Definição", items:[
          "Parâmetros podem ter valores padrão; use <code>None</code> como sentinela para mutáveis.",
          "<code>*args</code> captura posicionais extras como tupla; <code>**kwargs</code> captura nomeados extras como dict."
        ]},
        {code:"def somar(*numeros, arredondar=False, **opcoes):\n    total = sum(numeros)\n    return round(total) if arredondar else total\n\nsomar(1, 2, 3, arredondar=True)"},
        {h:"Escopo & closures", items:[
          "Variáveis criadas dentro de uma função são locais por padrão.",
          "<code>nonlocal</code> permite modificar variável de escopo externo (não global).",
          "Funções são objetos de primeira classe: podem ser passadas, retornadas, guardadas em listas."
        ]},
        {h:"Type hints", items:[
          "<code>def f(x: int) -> str:</code> não é reforçado em runtime, mas ajuda IDEs e ferramentas como <code>mypy</code>."
        ]}
      ],
      pitfall:"Nunca use lista/dict como valor <b>padrão</b> mutável — <code>def f(x=[]):</code> compartilha a mesma lista entre chamadas. Use <code>x=None</code> e crie a lista dentro da função.",
      exercicios:[
        {
          enunciado:"Escreva uma função media(*notas) que aceite qualquer quantidade de notas e retorne a média.",
          solucao:"def media(*notas):\n    if not notas:\n        return 0\n    return sum(notas) / len(notas)\n\nprint(media(7, 8, 9))     # 8.0\nprint(media(10))          # 10.0",
          explicacao:"*notas empacota todos os argumentos posicionais numa tupla, então a função funciona com 1, 3 ou 20 notas sem mudar a assinatura. O if not notas evita ZeroDivisionError se for chamada sem argumentos."
        },
        {
          enunciado:"Crie uma função contador() que retorne uma outra função (closure) que incrementa e retorna um contador a cada chamada.",
          solucao:"def contador():\n    n = 0\n    def incrementar():\n        nonlocal n\n        n += 1\n        return n\n    return incrementar\n\nprox = contador()\nprint(prox())  # 1\nprint(prox())  # 2\nprint(prox())  # 3",
          explicacao:"incrementar 'lembra' da variável n do escopo de contador() mesmo depois que contador() já terminou de executar — isso é uma closure. nonlocal é necessário para modificar (não só ler) a variável do escopo externo."
        }
      ]
    },
    {
      icon:"⇄", title:"Cálculo & Álgebra Linear", tags:"math · numpy · gradiente",
      sub:"Fundamentos",
      sections:[
        {h:"Módulo math", items:[
          "<code>math.sqrt</code>, <code>math.log</code>, <code>math.exp</code>, <code>math.isclose()</code> para comparação segura de floats."
        ]},
        {h:"NumPy para álgebra linear", items:[
          "Vetores e matrizes viram <code>ndarray</code>; operações são vetorizadas (muito mais rápidas que loops puros).",
          "Multiplicação de matriz usa <code>@</code> ou <code>np.dot()</code>, nunca <code>*</code> (que é elemento a elemento)."
        ]},
        {code:"import numpy as np\n\nA = np.array([[1, 2], [3, 4]])\nb = np.array([5, 6])\n\nx = A @ b          # produto matricial\ngrad = 2 * A.T @ (A @ x - b)  # passo de gradiente"},
        {h:"Ligação com ML", items:[
          "Gradiente descendente, no fundo, é apenas derivadas + atualização iterativa de parâmetros — vetorize sempre que possível em vez de laços <code>for</code>."
        ]}
      ],
      exercicios:[
        {
          enunciado:"Dado o vetor v = [3, 4], calcule sua norma (magnitude) usando NumPy.",
          solucao:"import numpy as np\n\nv = np.array([3, 4])\nnorma = np.linalg.norm(v)\nprint(norma)  # 5.0",
          explicacao:"np.linalg.norm calcula a raiz quadrada da soma dos quadrados (aqui, √(3²+4²) = 5), sem precisar escrever a fórmula manualmente com math.sqrt."
        },
        {
          enunciado:"Implemente um passo de gradiente descendente para minimizar f(x) = x², partindo de x=10, taxa de aprendizado 0.1, por 5 iterações.",
          solucao:"x = 10.0\ntaxa = 0.1\n\nfor i in range(5):\n    gradiente = 2 * x       # derivada de x^2\n    x = x - taxa * gradiente\n    print(f\"iteração {i+1}: x = {x:.4f}\")",
          explicacao:"A derivada de x² é 2x. A cada passo, x se move na direção oposta ao gradiente (por isso o sinal de menos), aproximando-se do mínimo em x=0."
        }
      ]
    }
  ],
  estruturas: [
    {
      icon:"▤", title:"Listas, Tuplas & Sets", tags:"slicing · compreensão · mutabilidade",
      sub:"Estruturas de Dados",
      sections:[
        {h:"Listas (mutáveis)", items:[
          "Slicing: <code>lista[inicio:fim:passo]</code>, aceita índices negativos.",
          "List comprehension é mais idiomática que <code>for</code> + <code>append</code> para transformações simples."
        ]},
        {code:"pares = [n for n in range(20) if n % 2 == 0]\nmatriz = [[i*j for j in range(3)] for i in range(3)]"},
        {h:"Tuplas (imutáveis)", items:[
          "Usadas para dados fixos e como chave de dicionário (listas não podem ser chave).",
          "Desempacotamento: <code>a, b = b, a</code> troca valores sem variável temporária."
        ]},
        {h:"Sets", items:[
          "Coleção não ordenada de elementos únicos — ótimo para checar pertencimento em O(1) e remover duplicatas.",
          "Operações de conjunto: <code>a | b</code> (união), <code>a & b</code> (interseção), <code>a - b</code> (diferença)."
        ]}
      ],
      pitfall:"<code>lista2 = lista1</code> copia a <b>referência</b>, não os dados. Para copiar de verdade use <code>lista1.copy()</code> ou <code>list(lista1)</code> (e <code>copy.deepcopy()</code> para listas aninhadas).",
      exercicios:[
        {
          enunciado:"Dada a lista [5, 1, 4, 2, 8, 1], remova os duplicados e retorne ordenada, usando compreensão + set.",
          solucao:"numeros = [5, 1, 4, 2, 8, 1]\nresultado = sorted(set(numeros))\nprint(resultado)  # [1, 2, 4, 5, 8]",
          explicacao:"set() elimina duplicados automaticamente porque só guarda elementos únicos; sorted() converte de volta para lista já ordenada."
        },

const ORDER = {
  fundamentos: "grid-fundamentos",
  estruturas: "grid-estruturas",
  poo: "grid-poo",
  ecossistema: "grid-ecossistema",
  avancado: "grid-avancado"
};

const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
const modalIcon = document.getElementById("modal-icon");
const modalTitle = document.getElementById("modal-title");
const modalSub = document.getElementById("modal-sub");
const modalBody = document.getElementById("modal-body");
const closeBtn = document.getElementById("close-btn");

let lastFocused = null;

function renderSections(sections){
  return sections.map(s => {
    if(s.code){
      return `<pre><code>${escapeHtml(s.code)}</code></pre>`;
    }
    const items = (s.items || []).map(it => `<li>${it}</li>`).join("");
    return `${s.h ? `<h4>${s.h}</h4>` : ""}<ul>${items}</ul>`;
  }).join("");
}

function renderExercicios(exercicios){
  if(!exercicios || !exercicios.length) return "";
  const blocos = exercicios.map((ex, i) => `
    <div class="exercicio">
      <div class="enunciado"><b>Exercício ${i + 1}.</b> ${ex.enunciado}</div>
      <details>
        <summary>Ver solução</summary>
        <div class="solucao">
          <pre><code>${escapeHtml(ex.solucao)}</code></pre>
          <p class="explicacao">${ex.explicacao}</p>
        </div>
      </details>
    </div>
  `).join("");
  return `<h4>Exercícios resolvidos</h4>${blocos}`;
}

function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function openCard(item){
  lastFocused = document.activeElement;
  modalIcon.textContent = item.icon;
  modalTitle.textContent = item.title;
  modalSub.textContent = item.sub;
  let html = renderSections(item.sections);
  if(item.pitfall){
    html += `<div class="pitfall"><b>Atenção:</b> ${item.pitfall}</div>`;
  }
  html += renderExercicios(item.exercicios);
  modalBody.innerHTML = html;
  overlay.classList.add("open");
  overlay.scrollTop = 0;
  document.body.style.overflow = "hidden";
  closeBtn.focus();
}

function closeModal(){
  overlay.classList.remove("open");
  document.body.style.overflow = "";
  if(lastFocused) lastFocused.focus();
}

closeBtn.addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => {
  if(e.target === overlay) closeModal();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    if(overlay.classList.contains("open")){
      closeModal();
    } else if(document.activeElement === searchInput && searchInput.value){
      searchInput.value = "";
      applyFilter();
    }
  }
});

function buildCard(item){
  const card = document.createElement("button");
  card.className = "card";
  card.type = "button";
  card.setAttribute("aria-haspopup", "dialog");
  card.dataset.search = (item.title + " " + item.tags).toLowerCase();
  card.innerHTML = `
    <span class="hint">abrir →</span>
    <span class="icon">${item.icon}</span>
    <h3>${item.title}</h3>
    <span class="tags">${item.tags}</span>
  `;
  card.addEventListener("click", () => openCard(item));
  return card;
}

const totalCards = Object.values(DATA).reduce((sum, arr) => sum + arr.length, 0);

for(const [key, gridId] of Object.entries(ORDER)){
  const grid = document.getElementById(gridId);
  DATA[key].forEach(item => grid.appendChild(buildCard(item)));
}

const searchInput = document.getElementById("search-input");
const searchCount = document.getElementById("search-count");
const noResults = document.getElementById("no-results");
const allCards = Array.from(document.querySelectorAll(".card"));
const allLabels = Array.from(document.querySelectorAll(".section-label"));
const allGrids = Array.from(document.querySelectorAll(".grid"));

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  let visibleTotal = 0;

  allGrids.forEach(grid => {
    let visibleInGrid = 0;
    Array.from(grid.children).forEach(card => {
      const match = !q || card.dataset.search.includes(q);
      card.classList.toggle("hidden", !match);
      if(match) visibleInGrid++;
    });
    grid.classList.toggle("hidden", visibleInGrid === 0);
    visibleTotal += visibleInGrid;
  });

  allLabels.forEach(label => {
    const section = label.dataset.section;
    const grid = document.getElementById(`grid-${section}`);
    label.classList.toggle("hidden", grid.classList.contains("hidden"));
  });

  noResults.classList.toggle("show", visibleTotal === 0);
  searchCount.textContent = q ? `${visibleTotal} de ${totalCards} tópicos` : "";
}

searchInput.addEventListener("input", applyFilter);
</script>
