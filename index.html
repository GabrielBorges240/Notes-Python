<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anotações de Python — Gabriel Borges</title>
<style>
  :root{
    --bg: #1b1b1b;
    --bg-soft: #222222;
    --card: #242424;
    --card-border: #3a3a3a;
    --card-border-hover: #d99a3d;
    --text: #e7e3da;
    --text-dim: #9a958a;
    --text-faint: #6f6a60;
    --accent: #e0a458;
    --accent-dim: #b98644;
    --mono: #7fb59e;
    --divider: #333333;
    /* Mayukai Mirage Gruvbox Darktooth (Base16 Darktooth) */
    --dt-bg: #1D2021;
    --dt-bg-alt: #32302F;
    --dt-border: #504945;
    --dt-comment: #665C54;
    --dt-fg: #D5C4A1;
    --dt-red: #FB543F;
    --dt-orange: #FE8625;
    --dt-yellow: #FAC03B;
    --dt-green: #95C085;
    --dt-aqua: #8BA59B;
    --dt-blue: #3FA6C4;
    --dt-purple: #C56AA0;
    --dt-brown: #A87322;
    --focus: #e0a458;
    --radius: 10px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
    line-height: 1.5;
    padding: 48px 24px 96px;
  }
  .wrap{ max-width: 1120px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 48px; }
  header h1{
    color: var(--accent);
    font-size: 1.9rem;
    letter-spacing: 1px;
    margin: 0 0 10px;
    font-weight: 700;
  }
  header p{
    color: var(--text-dim);
    letter-spacing: 3px;
    font-size: 0.78rem;
    text-transform: uppercase;
    margin: 0;
  }

  .section-label{
    display:flex; align-items:center; gap:10px;
    color: var(--text-dim);
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 40px 0 14px;
  }
  .section-label .n{ color: var(--accent-dim); }
  .section-label::after{
    content:""; flex:1; height:1px; background: var(--divider);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    color: inherit;
    font-family: inherit;
    display:flex;
    flex-direction:column;
    gap: 10px;
    position: relative;
  }
  .card:hover, .card:focus-visible{
    border-color: var(--card-border-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .card:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .card .icon{
    font-size: 1.3rem;
    color: var(--accent);
    line-height:1;
  }
  .card h3{
    margin: 0;
    font-size: 0.96rem;
    color: var(--accent);
    font-weight: 700;
  }
  .card .tags{
    color: var(--text-faint);
    font-size: 0.74rem;
    letter-spacing: .3px;
    margin-top: auto;
  }
  .card .hint{
    position:absolute; top:14px; right:16px;
    font-size: .68rem; color: var(--text-faint);
    opacity:0; transition: opacity .15s ease;
  }
  .card:hover .hint, .card:focus-visible .hint{ opacity:1; }

  /* Modal */
  .overlay{
    position: fixed; inset:0;
    background: var(--bg-soft);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding: 0;
    z-index: 50;
    overflow-y: auto;
  }
  .overlay.open{ display:flex; }

  .modal{
    background: var(--bg-soft);
    border: none;
    border-radius: 0;
    max-width: 860px;
    width: 100%;
    min-height: 100vh;
    padding: 32px 32px 60px;
    animation: rise .18s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .modal-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap: 16px;
    border-bottom: 1px solid var(--divider);
    padding-bottom: 16px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    background: var(--bg-soft);
    padding-top: 8px;
    margin-top: -8px;
    z-index: 1;
  }
  .modal-head .icon{ font-size: 1.5rem; color: var(--accent); }
  .modal-title{ display:flex; gap: 14px; align-items:flex-start; }
  .modal-title h2{
    margin: 0 0 4px; color: var(--accent); font-size: 1.25rem;
  }
  .modal-title .sub{ color: var(--text-dim); font-size: .78rem; letter-spacing: .5px; }

  .close-btn{
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    border-radius: 6px;
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    flex-shrink: 0;
  }
  .close-btn:hover, .close-btn:focus-visible{
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
  }

  .modal-body h4{
    color: var(--mono);
    font-size: .8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 22px 0 8px;
  }
  .modal-body h4:first-child{ margin-top: 0; }
  .modal-body ul{
    margin: 0 0 4px; padding-left: 18px;
    color: var(--text);
    font-size: .88rem;
  }
  .modal-body li{ margin-bottom: 5px; }
  .modal-body li b{ color: var(--text); }
  .modal-body p{ font-size: .88rem; color: var(--text); margin: 0 0 8px; }

  pre{
    background: var(--dt-bg);
    border: 1px solid var(--dt-border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: .82rem;
    color: var(--dt-fg);
    margin: 6px 0 4px;
  }
  pre code{ color: var(--dt-fg); background: none; padding: 0; }
  .tok-kw{ color: var(--dt-purple); font-weight: 700; }
  .tok-str{ color: var(--dt-green); }
  .tok-num{ color: var(--dt-orange); }
  .tok-com{ color: var(--dt-comment); font-style: italic; }
  .tok-fn{ color: var(--dt-blue); }
  .tok-bi{ color: var(--dt-yellow); }
  code{ color: var(--mono); }
  .modal-body p code, .modal-body li code{
    background: var(--dt-bg);
    color: var(--dt-fg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: .84rem;
  }

  .pitfall{
    margin-top: 18px;
    border-left: 3px solid var(--accent-dim);
    background: rgba(224,164,88,0.06);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: .84rem;
  }
  .pitfall b{ color: var(--accent); }

  .exercicio{
    border: 1px solid var(--card-border);
    border-radius: 8px;
    margin-top: 10px;
    overflow: hidden;
  }
  .exercicio .enunciado{
    padding: 10px 14px;
    font-size: .85rem;
    color: var(--text);
    background: #1f1f1f;
  }
  .exercicio .enunciado b{ color: var(--mono); }
  .exercicio details{ border-top: 1px solid var(--card-border); }
  .exercicio summary{
    padding: 8px 14px;
    font-size: .74rem;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--accent-dim);
    cursor: pointer;
    user-select: none;
    list-style: none;
  }
  .exercicio summary::-webkit-details-marker{ display:none; }
  .exercicio summary::before{ content: "▸ "; }
  .exercicio details[open] summary::before{ content: "▾ "; }
  .exercicio summary:hover{ color: var(--accent); }
  .exercicio .solucao{ padding: 2px 14px 12px; }
  .exercicio .explicacao{
    font-size: .82rem;
    color: var(--text-dim);
    margin: 6px 0 0;
  }

  .search-bar{
    max-width: 420px;
    margin: 0 auto 40px;
    position: relative;
  }
  .search-bar input{
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    font-family: inherit;
    font-size: .85rem;
    padding: 10px 14px 10px 34px;
    border-radius: 8px;
    outline: none;
    transition: border-color .15s ease;
  }
  .search-bar input::placeholder{ color: var(--text-faint); }
  .search-bar input:focus{ border-color: var(--card-border-hover); }
  .search-bar .icon{
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    font-size: .85rem;
    pointer-events: none;
  }
  .search-bar .count{
    text-align: center;
    color: var(--text-faint);
    font-size: .7rem;
    margin-top: 8px;
    letter-spacing: .5px;
  }
  .card.hidden{ display:none; }
  .section-label.hidden{ display:none; }
  .grid.hidden{ display:none; }
  .no-results{
    display:none;
    text-align:center;
    color: var(--text-faint);
    font-size: .82rem;
    padding: 40px 0;
  }
  .no-results.show{ display:block; }

  footer{
    text-align:center;
    color: var(--text-faint);
    font-size: .72rem;
    margin-top: 56px;
    letter-spacing: .5px;
  }

  @media (max-width: 480px){
    body{ padding: 32px 14px 72px; }
    .modal{ padding: 20px 16px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Anotações de Python</h1>
    <p>Gabriel Borges</p>
  </header>

  <div class="search-bar">
    <span class="icon">⌕</span>
    <input type="text" id="search-input" placeholder="Buscar por tópico, tag ou palavra-chave..." aria-label="Buscar anotações">
    <div class="count" id="search-count"></div>
  </div>

  <div id="sections">
  <div class="section-label" data-section="fundamentos"><span class="n">§</span> Fundamentos</div>
  <div class="grid" id="grid-fundamentos" data-section="fundamentos"></div>

  <div class="section-label" data-section="estruturas"><span class="n">§</span> Estruturas de Dados</div>
  <div class="grid" id="grid-estruturas" data-section="estruturas"></div>

  <div class="section-label" data-section="poo"><span class="n">§</span> Orientação a Objetos &amp; Erros</div>
  <div class="grid" id="grid-poo" data-section="poo"></div>

  <div class="section-label" data-section="ecossistema"><span class="n">§</span> Ecossistema &amp; Backend</div>
  <div class="grid" id="grid-ecossistema" data-section="ecossistema"></div>

  <div class="section-label" data-section="avancado"><span class="n">§</span> Recursos Avançados</div>
  <div class="grid" id="grid-avancado" data-section="avancado"></div>
  </div>

  <div class="no-results" id="no-results">Nenhum tópico encontrado. Tente outra palavra-chave.</div>

  <footer>Clique em qualquer card para abrir as anotações · Enter / Espaço também funciona</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <div class="modal-title">
        <span class="icon" id="modal-icon"></span>
        <div>
          <h2 id="modal-title"></h2>
          <div class="sub" id="modal-sub"></div>
        </div>
      </div>
      <button class="close-btn" id="close-btn" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const DATA = {
  fundamentos: [
    {
      icon:"⌗", title:"Sintaxe & Variáveis", tags:"tipos · indentação · f-strings",
      sub:"Fundamentos",
      sections:[
        {h:"Tipagem", items:["Python é <b>dinamicamente tipado</b>: o tipo é da variável em tempo de execução, não declarado.", "Tipos nativos: <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>, <code>NoneType</code>.", "Use <code>type(x)</code> para inspecionar e <code>isinstance(x, int)</code> para checar."]},
        {h:"Indentação", items:["Blocos são definidos por indentação (4 espaços é a convenção PEP8), não por chaves.", "Misturar tabs e espaços quebra o parser — configure o editor para converter tab em espaços."]},
        {code:"nome = \"Gabriel\"\nidade = 21\naltura = 1.78\n\nprint(f\"{nome} tem {idade} anos e {altura:.2f}m\")"},
        {h:"f-strings", items:["Preferíveis a <code>%</code> ou <code>.format()</code>: mais legíveis e mais rápidas.", "Suportam expressões dentro das chaves: <code>f\"{a + b}\"</code>."]}
      ],
      pitfall:"Cuidado: <code>0.1 + 0.2 != 0.3</code> por causa de ponto flutuante. Para comparar floats, use <code>math.isclose()</code>.",
      exercicios:[
        {
          enunciado:"Peça o nome e o ano de nascimento do usuário e imprima a idade aproximada dele em 2026, usando f-string.",
          solucao:"nome = input(\"Nome: \")\nano_nascimento = int(input(\"Ano de nascimento: \"))\n\nidade = 2026 - ano_nascimento\nprint(f\"{nome} tem aproximadamente {idade} anos.\")",
          explicacao:"input() sempre retorna string, por isso o ano precisa ser convertido com int() antes da subtração. A f-string insere a expressão idade diretamente no texto."
        },
        {
          enunciado:"Dado um preço em reais (float), imprima o valor formatado com 2 casas decimais e o símbolo R$.",
          solucao:"preco = 1234.5\nprint(f\"R$ {preco:.2f}\")",
          explicacao:"O especificador :.2f dentro da f-string arredonda e formata o float com exatamente duas casas decimais — não precisa de round() manual."
        },
        {
          enunciado:"Declare três variáveis (nome, cidade, idade) e imprima uma frase completa usando f-string com todas elas em uma única linha.",
          solucao:"nome = \"Marina\"\ncidade = \"Porto Velho\"\nidade = 28\n\nprint(f\"{nome}, {idade} anos, mora em {cidade}.\")",
          explicacao:"A f-string permite inserir múltiplas variáveis diretamente no texto sem precisar concatenar com + ou usar .format(), tornando a leitura do código mais direta."
        },
        {
          enunciado:"Escreva um trecho de código que soma dois números lidos do usuário com input(), tomando cuidado com a conversão de tipos.",
          solucao:"a = int(input(\"Primeiro número: \"))\nb = int(input(\"Segundo número: \"))\n\nsoma = a + b\nprint(f\"A soma é {soma}\")",
          explicacao:"input() sempre devolve uma string, então somar sem converter concatenaria os textos (ex: \"2\" + \"3\" = \"23\") em vez de somar os números. int() converte cada entrada antes da soma."
        }
      ]
    },
    {
      icon:"◈", title:"Tipos Primitivos", tags:"int · float · str · bool · NoneType",
      sub:"Fundamentos",
      sections:[
        {h:"int — números inteiros", items:["Representa números inteiros, sem limite de tamanho — Python ajusta a precisão automaticamente (não existe overflow como em outras linguagens).", "Operadores: <code>+ - * / // % **</code>. A divisão <code>/</code> sempre retorna <code>float</code>; use <code>//</code> para divisão inteira."]},
        {code:"a = 17\nb = 5\n\nprint(a / b)    # 3.4  (float)\nprint(a // b)   # 3    (divisão inteira)\nprint(a % b)    # 2    (resto)\nprint(a ** 2)   # 289  (potência)"},
        {h:"float — números de ponto flutuante", items:["Representa números com casas decimais, seguindo o padrão IEEE 754 — por isso alguns valores não têm representação exata (<code>0.1 + 0.2 != 0.3</code>).", "Converta com <code>float(x)</code>; para comparar com segurança, use <code>math.isclose(a, b)</code> em vez de <code>==</code>."]},
        {code:"preco = float(\"19.9\")\ndesconto = preco * 0.1\n\nprint(preco - desconto)   # 17.91\nprint(round(preco, 0))    # 20.0"},
        {h:"str — texto", items:["Sequência imutável de caracteres — qualquer método de \"modificação\" (como <code>.upper()</code>) retorna uma string nova, sem alterar a original.", "Suporta indexação (<code>s[0]</code>), fatiamento (<code>s[1:4]</code>) e métodos como <code>.strip()</code>, <code>.split()</code>, <code>.replace()</code>, <code>.join()</code>."]},
        {code:"frase = \"  Python é ótimo  \"\n\nprint(frase.strip())          # \"Python é ótimo\"\nprint(frase.strip().upper())  # \"PYTHON É ÓTIMO\"\nprint(frase.strip().split())  # ['Python', 'é', 'ótimo']"},
        {h:"bool — verdadeiro ou falso", items:["<code>bool</code> é, na prática, uma subclasse de <code>int</code>: <code>True</code> vale <code>1</code> e <code>False</code> vale <code>0</code> — por isso <code>True + True == 2</code>.", "Valores \"falsy\" (avaliados como <code>False</code> num <code>if</code>): <code>0</code>, <code>0.0</code>, <code>\"\"</code>, <code>[]</code>, <code>{}</code>, <code>None</code>. Todo o resto é \"truthy\"."]},
        {code:"lista = []\nnome = \"\"\n\nif not lista and not nome:\n    print(\"lista e nome estão vazios\")\n\nprint(True + True)             # 2\nprint(isinstance(True, int))   # True"},
        {h:"NoneType — ausência de valor", items:["<code>None</code> é o único valor do tipo <code>NoneType</code> — representa \"nenhum valor\", diferente de <code>0</code>, <code>\"\"</code> ou <code>False</code>.", "Funções sem <code>return</code> explícito retornam <code>None</code> automaticamente. Para comparar, use <code>is None</code> em vez de <code>== None</code> (mais rápido e semanticamente correto, já que <code>None</code> é um singleton)."]},
        {code:"def saudacao(nome):\n    print(f\"Olá, {nome}\")\n\nresultado = saudacao(\"Ana\")\nprint(resultado)           # None\nprint(resultado is None)   # True"}
      ],
      pitfall:"<code>bool</code> herda de <code>int</code>, então <code>True == 1</code> e <code>False == 0</code> retornam <code>True</code> — isso pode causar bugs sutis em comparações e em chaves de dicionário (<code>{1: \"a\", True: \"b\"}</code> tem só uma chave, porque <code>1 == True</code>).",
      exercicios:[
        {
          enunciado:"Escreva uma função que recebe um número inteiro e retorna 'par' ou 'ímpar', usando o operador de módulo.",
          solucao:"def par_ou_impar(n: int) -> str:\n    return \"par\" if n % 2 == 0 else \"ímpar\"\n\nprint(par_ou_impar(7))    # ímpar\nprint(par_ou_impar(10))   # par",
          explicacao:"n % 2 retorna o resto da divisão por 2: 0 para números pares e 1 para ímpares. O operador ternário (if/else em uma linha) evita escrever um bloco if/else completo."
        },
        {
          enunciado:"Dado um valor em float, arredonde para 2 casas decimais e diga se ele é aproximadamente igual, maior ou menor que 100.00, sem comparar floats diretamente com ==.",
          solucao:"import math\n\nvalor = 99.999999\nvalor = round(valor, 2)\n\nif math.isclose(valor, 100.00, abs_tol=0.01):\n    print(\"aproximadamente igual a 100\")\nelif valor > 100.00:\n    print(\"maior que 100\")\nelse:\n    print(\"menor que 100\")",
          explicacao:"math.isclose() evita problemas de precisão de ponto flutuante que fariam uma comparação == falhar mesmo quando os números são praticamente iguais."
        },
        {
          enunciado:"Escreva uma função que recebe uma string e retorna True se ela é um palíndromo (ignorando espaços e maiúsculas/minúsculas), False caso contrário.",
          solucao:"def eh_palindromo(texto: str) -> bool:\n    limpo = texto.lower().replace(\" \", \"\")\n    return limpo == limpo[::-1]\n\nprint(eh_palindromo(\"Ana\"))\n# True\nprint(eh_palindromo(\"Socorram me subi no onibus em marrocos\"))\n# True",
          explicacao:"texto[::-1] usa fatiamento com passo -1 para inverter a string. Comparar a versão limpa (minúscula, sem espaços) com sua versão invertida detecta o palíndromo."
        },
        {
          enunciado:"Implemente uma função buscar(dicionario, chave) que retorna o valor associado à chave ou None se a chave não existir, e trate esse None de forma segura ao usar o resultado.",
          solucao:"def buscar(dicionario: dict, chave):\n    return dicionario.get(chave)\n\nestoque = {\"maçã\": 10, \"banana\": 5}\nresultado = buscar(estoque, \"laranja\")\n\nif resultado is None:\n    print(\"Produto não encontrado\")\nelse:\n    print(f\"Quantidade: {resultado}\")",
          explicacao:"dict.get() retorna None por padrão quando a chave não existe, em vez de lançar KeyError como dicionario[chave] faria. Checar com is None trata esse caso sem quebrar o programa."
        }
      ]
    },
    {
      icon:"⌥", title:"Estruturas de Controle", tags:"if/elif/else · for · while",
      sub:"Fundamentos",
      sections:[
        {h:"Condicionais", items:["Python não tem <code>switch</code> nativo (mas 3.10+ tem <code>match/case</code>).", "Operadores lógicos são palavras: <code>and</code>, <code>or</code>, <code>not</code> — não <code>&&</code>/<code>||</code>."]},
        {code:"idade = 20\nif idade >= 18 and idade < 65:\n    categoria = \"adulto\"\nelif idade >= 65:\n    categoria = \"idoso\"\nelse:\n    categoria = \"menor\""},
        {h:"Laços", items:["<code>for</code> itera sobre qualquer iterável (não é laço de contador clássico).", "<code>range(inicio, fim, passo)</code> gera sequência sem alocar lista inteira.", "<code>while</code> + <code>break</code>/<code>continue</code> para controle fino.", "Todo <code>for</code>/<code>while</code> aceita <code>else</code>: executa se não houve <code>break</code>."]},

const ORDER = {
  fundamentos: "grid-fundamentos",
  estruturas: "grid-estruturas",
  poo: "grid-poo",
  ecossistema: "grid-ecossistema",
  avancado: "grid-avancado"
};

const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
const modalIcon = document.getElementById("modal-icon");
const modalTitle = document.getElementById("modal-title");
const modalSub = document.getElementById("modal-sub");
const modalBody = document.getElementById("modal-body");
const closeBtn = document.getElementById("close-btn");

let lastFocused = null;

function renderSections(sections){
  return sections.map(s => {
    if(s.code){
      return `<pre><code>${highlightPython(s.code)}</code></pre>`;
    }
    const items = (s.items || []).map(it => `<li>${it}</li>`).join("");
    return `${s.h ? `<h4>${s.h}</h4>` : ""}<ul>${items}</ul>`;
  }).join("");
}

function renderExercicios(exercicios){
  if(!exercicios || !exercicios.length) return "";
  const blocos = exercicios.map((ex, i) => `
    <div class="exercicio">
      <div class="enunciado"><b>Exercício ${i + 1}.</b> ${ex.enunciado}</div>
      <details>
        <summary>Ver solução</summary>
        <div class="solucao">
          <pre><code>${highlightPython(ex.solucao)}</code></pre>
          <p class="explicacao">${ex.explicacao}</p>
        </div>
      </details>
    </div>
  `).join("");
  return `<h4>Exercícios resolvidos</h4>${blocos}`;
}

function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

const PY_KEYWORDS = new Set(["def","class","import","from","as","if","elif","else","for","while","return","try","except","finally","raise","with","pass","break","continue","lambda","yield","None","True","False","and","or","not","in","is","global","nonlocal","assert","async","await","del"]);
const PY_BUILTINS = new Set(["print","len","range","int","str","float","bool","dict","list","set","tuple","input","open","enumerate","zip","map","filter","sum","min","max","sorted","reversed","isinstance","issubclass","super","staticmethod","classmethod","property","type","object","Exception","ValueError","TypeError","KeyError","IndexError","StopIteration","self","cls"]);

/* Tema Mayukai Mirage Gruvbox Darktooth aplicado como highlight de sintaxe Python */
function highlightPython(code){
  const tokenRe = /(#.*$)|((?:[rRbBfFuU]{1,2})?(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'))|(\b\d+\.?\d*\b)|([A-Za-z_][A-Za-z0-9_]*)/gm;
  let out = "";
  let last = 0;
  let m;
  while((m = tokenRe.exec(code)) !== null){
    out += escapeHtml(code.slice(last, m.index));
    last = tokenRe.lastIndex;
    const [full, comment, str, num, ident] = m;
    if(comment){
      out += `<span class="tok-com">${escapeHtml(comment)}</span>`;
    } else if(str){
      out += `<span class="tok-str">${escapeHtml(str)}</span>`;
    } else if(num){
      out += `<span class="tok-num">${escapeHtml(num)}</span>`;
    } else if(ident){
      const followedByParen = code.slice(tokenRe.lastIndex).match(/^\s*\(/);
      if(PY_KEYWORDS.has(ident)){
        out += `<span class="tok-kw">${escapeHtml(ident)}</span>`;
      } else if(followedByParen && !PY_KEYWORDS.has(ident)){
        out += `<span class="tok-fn">${escapeHtml(ident)}</span>`;
      } else if(PY_BUILTINS.has(ident)){
        out += `<span class="tok-bi">${escapeHtml(ident)}</span>`;
      } else {
        out += escapeHtml(ident);
      }
    }
  }
  out += escapeHtml(code.slice(last));
  return out;
}

function openCard(item){
  lastFocused = document.activeElement;
  modalIcon.textContent = item.icon;
  modalTitle.textContent = item.title;
  modalSub.textContent = item.sub;
  let html = renderSections(item.sections);
  if(item.pitfall){
    html += `<div class="pitfall"><b>Atenção:</b> ${item.pitfall}</div>`;
  }
  html += renderExercicios(item.exercicios);
  modalBody.innerHTML = html;
  overlay.classList.add("open");
  overlay.scrollTop = 0;
  document.body.style.overflow = "hidden";
  closeBtn.focus();
}

function closeModal(){
  overlay.classList.remove("open");
  document.body.style.overflow = "";
  if(lastFocused) lastFocused.focus();
}

closeBtn.addEventListener("click", closeModal);
overlay.addEventListener("click", (e) => {
  if(e.target === overlay) closeModal();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    if(overlay.classList.contains("open")){
      closeModal();
    } else if(document.activeElement === searchInput && searchInput.value){
      searchInput.value = "";
      applyFilter();
    }
  }
});

function buildCard(item){
  const card = document.createElement("button");
  card.className = "card";
  card.type = "button";
  card.setAttribute("aria-haspopup", "dialog");
  card.dataset.search = (item.title + " " + item.tags).toLowerCase();
  card.innerHTML = `
    <span class="hint">abrir →</span>
    <span class="icon">${item.icon}</span>
    <h3>${item.title}</h3>
    <span class="tags">${item.tags}</span>
  `;
  card.addEventListener("click", () => openCard(item));
  return card;
}

const totalCards = Object.values(DATA).reduce((sum, arr) => sum + arr.length, 0);

for(const [key, gridId] of Object.entries(ORDER)){
  const grid = document.getElementById(gridId);
  DATA[key].forEach(item => grid.appendChild(buildCard(item)));
}

const searchInput = document.getElementById("search-input");
const searchCount = document.getElementById("search-count");
const noResults = document.getElementById("no-results");
const allCards = Array.from(document.querySelectorAll(".card"));
const allLabels = Array.from(document.querySelectorAll(".section-label"));
const allGrids = Array.from(document.querySelectorAll(".grid"));

function applyFilter(){
  const q = searchInput.value.trim().toLowerCase();
  let visibleTotal = 0;

  allGrids.forEach(grid => {
    let visibleInGrid = 0;
    Array.from(grid.children).forEach(card => {
      const match = !q || card.dataset.search.includes(q);
      card.classList.toggle("hidden", !match);
      if(match) visibleInGrid++;
    });
    grid.classList.toggle("hidden", visibleInGrid === 0);
    visibleTotal += visibleInGrid;
  });

  allLabels.forEach(label => {
    const section = label.dataset.section;
    const grid = document.getElementById(`grid-${section}`);
    label.classList.toggle("hidden", grid.classList.contains("hidden"));
  });

  noResults.classList.toggle("show", visibleTotal === 0);
  searchCount.textContent = q ? `${visibleTotal} de ${totalCards} tópicos` : "";
}

searchInput.addEventListener("input", applyFilter);
</script>
